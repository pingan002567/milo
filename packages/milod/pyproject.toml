[project]
name = "milod"
version = "0.0.1"
description = "Milo 本地守护进程：秘书长 + MemberAdapter + 渲染器 + 事件存储"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "keyring>=25.0",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# embedded 成员依赖 DeerFlow harness（进程内客户端）。
# 预检已确认子目录含 pyproject（deerflow-harness 2.1.0，Python >=3.12）。
# TODO(spike-01): 将 @main 换为官方 release tag pin，锁死 config_version。
deerflow = [
    "deerflow-harness @ git+https://github.com/bytedance/deer-flow@main#subdirectory=backend/packages/harness",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milod"]

[tool.ruff]
line-length = 100
target-version = "py312"
